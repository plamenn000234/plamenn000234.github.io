<style>
/* Layout: a modern food app. Paprika-orange brand, every collection gets its own gradient "app icon" colour; recipes read as clean cards; the recipe page opens on a colour banner, then a tech-card body with a scaled quantity column. */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --bg:#F3F3F1; --surface:#FFFFFF; --sunk:#F7F7F5; --ink:#17181B; --muted:#6A6D74; --line:#E1E1DD; --line-2:#ECECE8;
  --accent:#E2552B; --accent-ink:#FFFFFF; --accent-soft:#FCE6DD; --ok:#21875A; --ok-soft:#DFF2E8; --mark:#E8A317; --warn:#C0392B; --warn-soft:#FBE3DF;
  --g-s:80%; --g1-l:60%; --g2-l:47%; --tint-s:70%; --tint-l:94%; --deep-s:60%; --deep-l:36%;
  --hero-1:#1A1B1F; --hero-2:#2A2B31; --hero-ink:#FFFFFF; --hero-muted:#B9BAC2; --hero-acc:#FF8A5B;
  --f-display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif; --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px; --shadow:0 1px 2px rgba(23,24,27,.05),0 8px 24px rgba(23,24,27,.07); --shadow-h:0 2px 4px rgba(23,24,27,.06),0 14px 34px rgba(23,24,27,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101113; --surface:#1A1B1F; --sunk:#151619; --ink:#F1F1F3; --muted:#9A9CA5; --line:#2C2D33; --line-2:#24252A;
  --accent:#FF7A4D; --accent-ink:#1A0C06; --accent-soft:#3A2219; --ok:#4CC38A; --ok-soft:#173226; --mark:#F5B83A; --warn:#FF7B6B; --warn-soft:#3A1D1A;
  --g-s:62%; --g1-l:50%; --g2-l:38%; --tint-s:30%; --tint-l:16%; --deep-s:70%; --deep-l:74%;
  --hero-1:#202127; --hero-2:#2C2D35; --hero-ink:#FFFFFF; --hero-muted:#A9AAB4; --hero-acc:#FF8A5B;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-h:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101113; --surface:#1A1B1F; --sunk:#151619; --ink:#F1F1F3; --muted:#9A9CA5; --line:#2C2D33; --line-2:#24252A;
  --accent:#FF7A4D; --accent-ink:#1A0C06; --accent-soft:#3A2219; --ok:#4CC38A; --ok-soft:#173226; --mark:#F5B83A; --warn:#FF7B6B; --warn-soft:#3A1D1A;
  --g-s:62%; --g1-l:50%; --g2-l:38%; --tint-s:30%; --tint-l:16%; --deep-s:70%; --deep-l:74%;
  --hero-1:#202127; --hero-2:#2C2D35; --hero-ink:#FFFFFF; --hero-muted:#A9AAB4; --hero-acc:#FF8A5B;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-h:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-variant-numeric:tabular-nums}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;width:1em;overflow:hidden;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;flex:none;user-select:none}
.ms.f{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:30;background:var(--bg)}

/* top bar */
.top{position:sticky;top:var(--sat);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:14px;padding-block:12px;max-width:1280px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;flex:none;text-decoration:none;color:inherit}
.logo .lg{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#FF8A4C,#E2452B);box-shadow:0 4px 12px rgba(226,69,43,.35)}
.logo .lg .ms{font-size:22px}
.logo b{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 42px 0 46px;font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.search>.ms{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:22px}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.search .clr .ms{font-size:20px}
.search .clr:hover{background:var(--sunk)}
.topnav{display:flex;gap:2px;flex:none;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:4px}
.topnav a{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:13.5px}
.topnav a .ms{font-size:19px}
.topnav a:hover{color:var(--ink)}
.topnav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800}
.badge:empty{display:none}

.wrap{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:0 28px;align-items:start}
.rail{position:sticky;top:calc(var(--sat) + 76px);max-height:calc(100vh - 92px);overflow:auto;padding-bottom:24px;scrollbar-width:thin}
.rail h3{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px 8px}
.rail h3:first-child{margin-top:6px}
.rail .cl{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 8px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink)}
.rail .cl:hover{background:var(--surface)}
.rail .cl[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:var(--shadow)}
.rail .cl>span:first-child{display:flex;align-items:center;gap:9px;min-width:0}
.rail .cl i{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff;font-style:normal;background:linear-gradient(140deg,hsl(var(--h) var(--g-s) var(--g1-l)),hsl(calc(var(--h) - 18) var(--g-s) var(--g2-l)))}
.rail .cl i .ms{font-size:15px}
.rail .cl>span:last-child{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
main{min-width:0}
.wrap>.rail{grid-column:1;grid-row:1/span 2}
.wrap>.cookbar,.wrap>main{grid-column:2}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:700;white-space:nowrap}
.chip .ms{font-size:17px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.free[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip .n{font-size:11px;opacity:.8}
.fpanel{margin-top:10px;padding:14px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.fpanel p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.fpanel .filters{gap:5px}

/* hero */
.hero{position:relative;overflow:hidden;margin-top:6px;border-radius:30px;padding:42px 40px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;color:var(--hero-ink);
  background:radial-gradient(circle at 92% 12%,rgba(255,138,76,.35),rgba(255,138,76,0) 42%),radial-gradient(circle at 70% 110%,rgba(226,69,43,.30),rgba(226,69,43,0) 45%),linear-gradient(135deg,var(--hero-1),var(--hero-2))}
.hero>*{position:relative;z-index:1;min-width:0}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,5vw,54px);line-height:.98;letter-spacing:-.03em;margin:0;text-wrap:balance;max-width:15ch;color:var(--hero-ink)}
.pro-tag{display:inline-block;margin:0 0 14px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#FFC59E;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#FFB36B,#FF6B3D);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:14px 0 0;color:var(--hero-muted);max-width:56ch;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stats span{display:inline-flex;align-items:baseline;gap:5px;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:12.5px;color:var(--hero-muted)}
.stats b{color:var(--hero-ink);font-weight:800;font-size:14px}
.pop{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;align-items:center}
.pop small{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-muted);margin-right:4px}
.pop button{height:34px;padding:0 14px;border-radius:999px;background:#fff;color:#17181B;font-weight:700;font-size:13px}
.pop button:hover{background:#FFE2D4}
.cluster{position:relative;height:270px}
.cluster .plate{position:absolute;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.cluster .p1{--ps:150px;right:16%;top:10px;transform:rotate(-8deg)}
.cluster .p2{--ps:112px;left:6%;bottom:4px;transform:rotate(7deg)}
.cluster .p3{--ps:96px;right:0;bottom:10px;transform:rotate(10deg)}
.cluster .p4{--ps:72px;left:16%;top:16px;transform:rotate(-12deg)}

/* app-icon thumbnails */
.plate{--h:20;--ps:64px;flex:none;width:var(--ps);height:var(--ps);border-radius:calc(var(--ps) * .3);display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.35),rgba(255,255,255,0) 45%),linear-gradient(140deg,hsl(var(--h) var(--g-s) var(--g1-l)),hsl(calc(var(--h) - 18) var(--g-s) var(--g2-l)));
  box-shadow:0 6px 16px -6px hsl(var(--h) 70% 40% / .55),inset 0 0 0 1px rgba(255,255,255,.12)}
.plate .ms{font-size:calc(var(--ps) * .5);width:auto;font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 48;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}

.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-size:25px;letter-spacing:-.02em;margin:0}
.sec-h small{font-size:13px;color:var(--muted);font-weight:600}
.feat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;padding:22px 24px;border-radius:26px;background:var(--surface);box-shadow:var(--shadow);text-decoration:none;color:inherit}
.feat:hover{box-shadow:var(--shadow-h)}
.feat .plate{--ps:120px}
.feat .ey{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.feat .ey .ms{font-size:16px}
.feat h3{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3vw,34px);line-height:1.02;letter-spacing:-.025em;margin:8px 0 4px;text-wrap:balance}
.feat p{margin:0;color:var(--muted)}
.feat .meta{margin-top:12px}
.feat .go{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
.tile{--h:20;position:relative;overflow:hidden;min-height:132px;border-radius:24px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;color:#fff;
  background:radial-gradient(circle at 100% 0%,rgba(255,255,255,.28),rgba(255,255,255,0) 50%),linear-gradient(150deg,hsl(var(--h) var(--g-s) var(--g1-l)),hsl(calc(var(--h) - 18) var(--g-s) var(--g2-l)));
  box-shadow:0 10px 22px -12px hsl(var(--h) 70% 35% / .7)}
.tile:hover{transform:translateY(-3px);box-shadow:0 16px 30px -12px hsl(var(--h) 70% 35% / .8)}
.tile .bgi{position:absolute;right:-12px;top:-10px;opacity:.95}
.tile .bgi .ms{font-size:78px;width:auto;opacity:.32;font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 48;transform:rotate(-10deg)}
.tile .ic{display:none}
.tile .tx{display:flex;flex-direction:column;gap:1px;position:relative}
.tile .tx b{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1;letter-spacing:-.01em;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.tile .tx span{font-size:12.5px;font-weight:700;opacity:.88}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.how div{padding:18px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.how .ms{font-size:28px;color:var(--accent);margin-bottom:8px}
.how b{display:block;font-family:var(--f-display);font-size:18px;font-weight:800;margin-bottom:4px}
.how p{margin:0;color:var(--muted);font-size:14px}

/* results */
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin:18px 0 10px}
.rhead h2{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;letter-spacing:-.02em}
.rhead select,#sort{height:36px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 12px;font-size:13.5px;font-weight:600}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:12px 8px 12px 12px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);position:relative}
.row:hover{box-shadow:var(--shadow-h)}
.row>a{display:flex;gap:14px;align-items:center;color:inherit;text-decoration:none;min-width:0}
.row>a>div{min-width:0}
.row .t{font-weight:800;font-size:15.5px;line-height:1.25;letter-spacing:-.005em}
.row .s{color:var(--muted);font-size:13px;line-height:1.3;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:6px;font-size:12px;color:var(--muted)}
.meta .f{font-weight:700;color:var(--ink)}
.algs{display:inline-flex;flex-wrap:wrap;gap:3px}
.al{display:inline-grid;place-items:center;min-width:20px;height:19px;padding:0 5px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums}
.diet{display:inline-flex;align-items:center;gap:3px;color:var(--ok);font-weight:700}
.diet .ms{font-size:15px}
.acts{display:flex;flex-direction:column;gap:2px}
.ib{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:var(--muted)}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib .ms{font-size:22px}
.ib.on{color:var(--mark)}
.ib.on .ms{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.ib.add.on{color:var(--ok)}
.more{display:block;width:100%;margin-top:14px;height:48px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:800}
.empty{padding:34px 18px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* recipe sheet */
.back{display:inline-flex;align-items:center;gap:6px;margin:12px 0 8px;color:var(--muted);font-weight:700;font-size:14px}
.back:hover{color:var(--ink)}
.sheet{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.sh-head{--h:20;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:28px 28px 24px;color:#fff;
  background:radial-gradient(circle at 100% 0%,rgba(255,255,255,.25),rgba(255,255,255,0) 45%),linear-gradient(140deg,hsl(var(--h) var(--g-s) var(--g1-l)),hsl(calc(var(--h) - 18) var(--g-s) calc(var(--g2-l) - 6%)))}
.crumb{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.crumb button{color:#fff;font-weight:800;letter-spacing:inherit;text-transform:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.5)}
.sh-head h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.2vw,44px);line-height:1;letter-spacing:-.03em;margin:8px 0 0;text-wrap:balance;text-shadow:0 1px 3px rgba(0,0,0,.12)}
.sh-head .sub{font-size:17px;color:rgba(255,255,255,.88);margin-top:8px;text-wrap:balance}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.strip div{display:flex;flex-direction:column;gap:0;padding:7px 12px;border-radius:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22)}
.strip small{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.8)}

function filtered(){
  const toks=fold(ui.q).split(/[^\p{L}\p{N}%]+/u).filter(t=>t.length>1||/\d/.test(t));
  const out=[];
  for(const r of R){
    if(ui.coll>=0&&!inColl(r,ui.coll))continue;
    if(ui.diet&&r.diet<ui.diet)continue;
    if(ui.free.size&&r.algs.some(a=>ui.free.has(a)))continue;
    if(ui.low&&!(r.kcal>0&&r.kcal<=400))continue;
    let score=0;
    if(toks.length){
      let ok=true;
      for(const t of toks){
        if(r.tl.startsWith(t))score+=6; else if(r.tl.includes(t))score+=4; else if(r.hay.includes(t))score+=2;
        else if(r.lines.some(l=>prodHay[l[0]].includes(t)))score+=1; else {ok=false;break}
      }
      if(!ok)continue;
    }
    out.push([r,score]);
  }
  if(ui.sort==="az")out.sort((a,b)=>a[0].t.localeCompare(b[0].t));
  else if(ui.sort==="kcal")out.sort((a,b)=>(a[0].kcal||9999)-(b[0].kcal||9999));
  else if(toks.length)out.sort((a,b)=>b[1]-a[1]||a[0].t.localeCompare(b[0].t));
  else out.sort((a,b)=>a[0].t.localeCompare(b[0].t));
  return out.map(x=>x[0]);
}

let prices=lsGet("bb-prices",{});
const CURS=[["EUR","€"],["USD","$"],["JPY","¥"],["GBP","£"],["CNY","CN¥"],["AUD","A$"],["CAD","C$"],["CHF","CHF"],["HKD","HK$"],["SGD","S$"]];

function setCur(c){const x=CURS.find(y=>y[0]===c);if(!x)return;CURC=c;CUR=x[1];lsSet("bb-cur",c)}
function priceOf(pi){const v=prices[D.products[pi][0]];return typeof v==="number"&&v>0?v:null}
function recipeCost(r){let sum=0,n=0;for(const [pi,g] of r.lines){const pr=D.products[pi],pv=priceOf(pi);if(pv!=null){sum+=g*pr[3]/pr[4]*pv;n++}}return {sum,n,of:r.lines.length}}

function batchG(r,d,f){let tot=0,yl=null;(d&&d.c||[]).forEach(c=>c[2].forEach(x=>{if(typeof x[1]!=="number")return;if(/^(cooked |total )?yield/i.test(x[0])){yl=(yl||0)+x[1];return}if(/\([A-Z]\)\s*$/.test(x[0]))return;tot+=x[1]}));return {raw:Math.round(tot*f),cooked:r.pg&&(!r.pu||r.pu==="g")?Math.round(r.pg*scale.p):(d&&d.c.length===1&&yl!=null?Math.round(yl*f):null)}}

/* ---------- order ---------- */
function course(r){
  const f=D.folders[r.f][0], s=(r.sub||"").toLowerCase(), n=r.name.toLowerCase();
  if(f==="Soups"||/soup/.test(s)||/\bsoup\b|chorba|broth|velout|shorba/.test(n))return ["Soup",100];
  if(/pasta|spaghetti|penne|tagliatelle|lasagne|risotto|gnocchi/.test(s+" "+n))return ["Pasta",50];
  if(f==="Salads"||f==="Starters"||/cold|salad|starter|mezze|antipast/.test(s))return ["Cold",50];
  if(f==="Sides"||/garnish|side/.test(s))return ["Garnish",50];
  return ["Main",90];
}
function addLine(id){
  const r=byId.get(id); if(!r)return;
  if(inOrder(id)){ord.lines=ord.lines.filter(l=>l.id!==id);saveDraft();toast("Removed from the order");return}
  const c=course(r); const buf=!!r.pg&&(r.pu==="g"||!r.pu);
  ord.lines.push({id,pax:null,mode:buf?"buffet":"plated",gpg:buf?c[1]:null,pre:buf?c[0]:null,k:1});
  saveDraft(); toast("Added to the order");
}
function linePax(l){return (l.pax===null||l.pax===""||isNaN(l.pax))?Number(ord.pax)||0:Number(l.pax)}
function portions(l){
  const r=byId.get(l.id); if(!r)return 0; let p=linePax(l);
  if(l.mode==="buffet"){p*=Number(l.k)||1; if(l.gpg&&r.pg)p*=Number(l.gpg)/r.pg}
  return p*(1+(Number(ord.reserve)||0)/100);
}
function roundQty(q,u){if(q<=0)return 0;if(u==="pcs")return Math.ceil(q-1e-9);if(q>=5)return Math.ceil(q*2-1e-9)/2;if(q>=0.5)return Math.ceil(q*10-1e-9)/10;return Math.ceil(q*100-1e-9)/100}
function fmtQ(q){if(!q)return"–";return q<1?q.toFixed(2).replace(/0+$/,"").replace(/\.$/,""):(Math.round(q*10)/10).toString()}
function compute(){
  const acc=new Map(), algs=new Set();
  for(const l of ord.lines){const r=byId.get(l.id); if(!r)continue; const p=portions(l); r.algs.forEach(a=>algs.add(a));
    for(const [pi,g] of r.lines){const pr=D.products[pi]; const key=pr[0]+"|"+pr[2]; const q=g*p*pr[3]/pr[4];
      const e=acc.get(key)||{name:pr[0],sec:pr[1],unit:pr[2],note:pr[5],q:0}; e.q+=q; acc.set(key,e)}}
  const secs=D.sections.map(()=>[]);
  for(const e of acc.values()){const q=roundQty(e.q,e.unit); if(q>0)secs[e.sec].push({...e,q})}
  secs.forEach(s=>s.sort((a,b)=>a.name.localeCompare(b.name)));
  const miss=ord.lines.map(l=>byId.get(l.id)).filter(r=>r&&!r.lines.length).map(r=>r.name);
  const cost={sum:0,n:0};for(const s of secs)for(const it of s){const pv=prices[it.name];if(typeof pv==="number"&&pv>0){it.cost=it.q*pv;cost.sum+=it.cost;cost.n++}}
  return {secs,algs:[...algs].sort((a,b)=>a-b),count:secs.reduce((a,s)=>a+s.length,0),miss,cost};
}

const CYR={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sht","ъ":"a","ы":"y","ь":"y","э":"e","ю":"yu","я":"ya"};
function pdfSafe(s){return String(s).replace(/≈/g,"~").replace(/[–—]/g,"-").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/×/g,"x").replace(/·/g,"-").replace(/…/g,"...").replace(/≤/g,"<=").replace(/≥/g,">=").replace(/→/g,"->").replace(/[а-яёА-ЯЁ]/g,ch=>{const lo=ch.toLowerCase(),t=CYR[lo];if(t==null)return"";return ch===lo?t:t.charAt(0).toUpperCase()+t.slice(1)}).replace(/[^\x00-\xFF]/g,ch=>{const b=ch.normalize("NFD")[0];return b.charCodeAt(0)<256?b:({"ı":"i","ł":"l","ő":"o","ű":"u","œ":"oe","Œ":"OE"}[ch]||"")})}
function fileBase(s){return pdfSafe(s||"file").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w\-]+/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"").slice(0,80)}
async function saveFile(filename,data){
  if(window.ChefsheetApp){try{const type=/\.pdf$/i.test(filename)?"application/pdf":/\.csv$/i.test(filename)?"text/csv":"application/octet-stream";const by=typeof data==="string"?new TextEncoder().encode(data):new Uint8Array(data);let bin="";for(let i=0;i<by.length;i+=32768)bin+=String.fromCharCode.apply(null,by.subarray(i,i+32768));if(ChefsheetApp.saveFile(filename,type,btoa(bin))==="ok")return}catch(e){}toast("Could not save the file. Use Copy.");return}
  if(!downloads){try{const type=/\.pdf$/i.test(filename)?"application/pdf":/\.csv$/i.test(filename)?"text/csv":"application/octet-stream";const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Saved "+filename)}catch(e){toast("Could not save the file. Use Copy.")}return}
  try{await downloads.save({filename,data});toast("Saved "+filename)}
  catch(e){const code=e&&e.code;if(code==="declined")return;toast(code==="host_unavailable"?"This app can't save files. Open it in a browser.":"Could not save the file ("+(code||"error")+")")}
}

function recipePdf(r,d){

    y+=2; doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
    c[3].forEach((s,i)=>{const ls=doc.splitTextToSize(pdfSafe(s),W-2*M-8); page(ls.length*4.4+1); doc.setFont("helvetica","bold"); doc.text(String(i+1)+".",M+2,y); doc.setFont("helvetica","normal"); doc.text(ls,M+8,y); y+=ls.length*4.4+1.4});
    y+=4});
  if(d.st){const ls=doc.splitTextToSize(pdfSafe("Storage: "+d.st),W-2*M);page(ls.length*4.4);doc.setFontSize(9.5);doc.text(ls,M,y);y+=ls.length*4.4+2}

      saveFile("Order_List_"+fileBase(ord.name||"order")+(ord.date?"_"+ord.date:"")+".csv",data);return}
    if(t.dataset.open){openOrder(t.dataset.open);return}
    if(t.dataset.del){delOrder(t.dataset.del);return}
  });
  document.addEventListener("change",e=>{
    const t=e.target;
    if(t.id==="sort"){ui.sort=t.value;route();return}
    if(t.dataset&&t.dataset.supset!=null){if(t.value)sup.map[t.dataset.supset]=t.value;else delete sup.map[t.dataset.supset];supSave();refreshTicket();return}
    if(t.dataset&&t.dataset.spf){const row=t.closest("[data-spid]");const x=sup.list.find(y=>y.id===row.dataset.spid);if(x){x[t.dataset.spf]=t.value.trim();if(x.name){supSave();toast("Saved")}}return}
    if(t.id==="pr-cur"){setCur(t.value);viewPrices((location.hash||"").slice(8));return}
    if(t.id==="mine-imp"&&t.files&&t.files[0]){mineImport(t.files[0]);t.value="";return}
    if(t.dataset&&t.dataset.tool!=null){toolInput(t);refreshTool(t.tagName==="INPUT"&&t.type!=="search");return}
    if(t.id==="sc-p"){scale.p=Math.max(1,Math.min(5000,Math.round(Number(t.value)||1)));rerender();return}
    const li=t.closest&&t.closest("[data-li]");
    if(li&&t.dataset.f){const l=ord.lines[+li.dataset.li];const v=t.value;
      if(t.dataset.f==="pax")l.pax=v===""?null:Number(v);
      if(t.dataset.f==="gpg"){l.gpg=v===""?null:Number(v);l.pre=(PRESETS.find(p=>p[1]===l.gpg)||[])[0]||null}
      if(t.dataset.f==="k")l.k=Number(v);
      saveDraft();refreshTicket();return}
    if(["o-name","o-date","o-pax","o-res"].includes(t.id)){ord.name=$("o-name").value;ord.date=$("o-date").value;ord.pax=Number($("o-pax").value)||0;ord.reserve=Number($("o-res").value)||0;saveDraft();refreshTicket()}
  });
  document.addEventListener("input",e=>{const t=e.target;if(t.id==="o-name"){ord.name=t.value;saveDraft()}
    if(t.dataset&&t.dataset.tool!=null&&t.tagName==="INPUT"){toolInput(t);clearTimeout(bind._tt);const soft=t.type!=="search";bind._tt=setTimeout(()=>refreshTool(soft),soft?150:120)}
    if(t.id==="cert-name"){LP.name=t.value.trim();saveLP()}
    if(t.dataset&&t.dataset.price!=null){const v=parseFloat(String(t.value).replace(",","."));if(isFinite(v)&&v>0)prices[t.dataset.price]=v;else delete prices[t.dataset.price];lsSet("bb-prices",prices)}
    if(t.id==="tool-q"){const q=fold(t.value.trim());let n=0;document.querySelectorAll("#tools-sec .tool").forEach(a=>{const ok=!q||q.split(/\s+/).every(w=>a.dataset.tk.includes(w));a.hidden=!ok;if(ok)n++});$("tool-none").hidden=n>0}
    if(t.id==="pr-q"){prQ=t.value;clearTimeout(bind._pq);bind._pq=setTimeout(()=>{const pos=t.selectionStart;viewPrices((location.hash||"").slice(8));const n=$("pr-q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}},150)}});
}

/* ---------- capabilities ---------- */
async function caps(){
  if(!window.claude||!window.claude.use)return;
  try{downloads=await window.claude.use("downloads")}catch(e){downloads=null}
  try{db=await window.claude.use("db")}catch(e){db=null}
  if(!db)return;
  try{const u=await window.claude.use("user");uid=u?await u.id():null}catch(e){uid=null}
  if(!uid)return;
  userCol=db.collection("data/users/"+uid);
  const timer=setTimeout(()=>{},10000);
  userCol.where("kind","==","order").limit(300).onSnapshot(s=>{clearTimeout(timer);savedDocs=[...s.docs].sort((a,b)=>(b.data().updatedAt||0)-(a.data().updatedAt||0));if(location.hash==="#orders")viewOrders()},()=>{clearTimeout(timer);userCol=null;if(location.hash==="#orders")viewOrders()});
  userCol.doc("favs").onSnapshot(s=>{favRemote=true;if(s.exists){const ids=(s.data().ids||[]).filter(x=>byId.has(x));const local=lsGet("bb-favs",[]);const merged=[...new Set([...ids,...local])];
      if(merged.length!==ids.length&&!s.metadata.fromCache)userCol.doc("favs").set({kind:"favs",ids:merged,updatedAt:Date.now()}).catch(()=>{});
      favs=merged}else if(!s.metadata.fromCache&&favs.length){userCol.doc("favs").set({kind:"favs",ids:favs,updatedAt:Date.now()}).catch(()=>{})}
    lsSet("bb-favs",favs);badges();if(location.hash==="#fav")viewFav()},()=>{favRemote=false});
  if(location.hash==="#orders")viewOrders();
}

async function boot(){
  favs=lsGet("bb-favs",[]); recent=lsGet("bb-recent",[]); ord=lsGet("bb-order",null);
  if(!ord||!Array.isArray(ord.lines))ord=blankOrder();
  bind();
  try{const r=await fetch("index.json");if(!r.ok)throw new Error("http");D=await r.json()}catch(e){$("main").innerHTML='<div class="empty" style="margin-top:20px"><b>The recipe library did not load</b>Check your connection and reload the page.</div>';return}
  prep(); favs=favs.filter(x=>byId.has(x)); ord.lines=ord.lines.filter(l=>byId.has(l.id)); badges();
  route(); caps(); regSW();
}
boot();
})();
</script>
